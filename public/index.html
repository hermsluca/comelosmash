<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <link rel="shortcut icon" href="/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/favicon.ico" type="image/x-icon" />
    <title>Com'è lo smash</title>
    <style>
      :root {
        color-scheme: light dark;
      }
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        background: #f7f7f7;
      }
      main {
        display: flex;
        flex-direction: column;
        height: 100dvh;
        justify-content: center;
        align-items: center;
        margin: 0 auto;
      }
      button {
        padding: 0.75rem 1.2rem;
        margin: 0.5rem;
        font-size: 1rem;
        cursor: pointer;
      }
      footer {
        bottom: 1rem;
        width: 100%;
        position: absolute;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
      }
      footer a {
        margin: 0.25rem;
        color: inherit;
      }
      @media (prefers-color-scheme: dark) {
        body {
          background: #323232;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <button id="comeloButton">Com'è lo smash?</button>
      <button id="consigliButton">Lo consigli?</button>
    </main>

    <footer>
      <a href="./disclaimer.html">Disclaimer</a>
      <a
        href="https://www.instagram.com/paninoteca_da_daniele/"
        target="_blank"
      >
        Instagram: Paninoteca da Daniele
      </a>
    </footer>

    <script>
      const comelo = new Audio("/sounds/comelo.mp3");
      const consigli = new Audio("/sounds/consigli.mp3");

      const comeloButton = document.getElementById("comeloButton");
      const consigliButton = document.getElementById("consigliButton");

      comeloButton.addEventListener("click", () => {
        comelo.play();
      });

      consigliButton.addEventListener("click", () => {
        consigli.play();
      });
    </script>
  </body>
</html>
