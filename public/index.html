<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Com'è lo smash - Sound buttons" />
    <meta name="keywords" content="smash, sound, interactive, game" />
    <meta
      name="theme-color"
      content="#f7f7f7"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#323232"
      media="(prefers-color-scheme: dark)"
    />
    <meta property="og:title" content="Com'è lo smash" />
    <meta property="og:description" content="Com'è lo smash - Sound buttons" />
    <meta property="og:type" content="website" />
    <link rel="shortcut icon" href="/images/favicon.ico" type="image/x-icon" />
    <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />
    <title>Com'è lo smash</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main>
      <button id="comeloButton">Com'è lo smash?</button>
      <button id="consigliButton">Lo consigli?</button>
      <button id="dadoveButton">Da dove veniamo?</button>
    </main>

    <footer>
      <a href="./disclaimer.html">Disclaimer</a>
      <a
        href="https://www.instagram.com/paninoteca_da_daniele/"
        target="_blank"
      >
        Instagram: Paninoteca da Daniele
      </a>
    </footer>

    <script>
      const comelo = new Audio("/sounds/comelo.mp3");
      const consigli = new Audio("/sounds/consigli.mp3");
      const dadove = new Audio("/sounds/dadove.mp3");

      const comeloButton = document.getElementById("comeloButton");
      const consigliButton = document.getElementById("consigliButton");
      const dadoveButton = document.getElementById("dadoveButton");

      comeloButton.addEventListener("click", () => {
        comelo.play();
      });

      consigliButton.addEventListener("click", () => {
        consigli.play();
      });

      dadoveButton.addEventListener("click", () => {
        dadove.play();
      });
    </script>
  </body>
</html>
