      content="#f7f7f7"

      content="#323232"
      media="(prefers-color-scheme: dark)"
    />
    <meta property="og:title" content="Com'è lo smash? | Soundboard del meme" />
    <meta
      property="og:description"
      content="È buono? Lo consigli? Da dove vieni? Riproduci le frasi della soundboard di Com'è lo smash."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://smash.heyluca.de/" />

    <meta property="og:locale" content="it_IT" />
    <meta name="twitter:card" content="summary" />

      name="twitter:title"

    <link rel="canonical" href="https://smash.heyluca.de/" />
    <link
      rel="sitemap"
      type="application/xml"
      title="Sitemap"
      href="/sitemap.xml"
    />

    <link rel="icon" href="/images/favicon.ico" type="image/x-icon" />

    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main>
      <button id="comeloButton">Com'è lo smash?</button>
      <button id="consigliButton">Lo consigli?</button>
      <button id="dadoveButton">Da dove veniamo?</button>
    </main>

    <footer>
      <a href="./disclaimer.html">Disclaimer</a>
      <a href="https://comelosmash.it" target="_blank">comelosmash.it</a>
      <a
        href="https://www.instagram.com/paninoteca_da_daniele/"
        target="_blank"
      >
        Instagram: Paninoteca da Daniele
      </a>
    </footer>

    <script>
      const comelo = new Audio("/sounds/comelo.mp3");
      const consigli = new Audio("/sounds/consigli.mp3");
      const dadove = new Audio("/sounds/dadove.mp3");

      const comeloButton = document.getElementById("comeloButton");
      const consigliButton = document.getElementById("consigliButton");
      const dadoveButton = document.getElementById("dadoveButton");

      comeloButton.addEventListener("click", () => {
        comelo.play();
      });

      consigliButton.addEventListener("click", () => {
        consigli.play();
      });

      dadoveButton.addEventListener("click", () => {
        dadove.play();
      });
    </script>
  </body>
