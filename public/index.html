    <link

    <title>Com'è lo smash? È buono? | Soundboard del meme</title>
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body>
    <main>
      <button type="button" data-sound="comelo" aria-pressed="false">
        Com'è lo smash?
      </button>
      <button type="button" data-sound="consigli" aria-pressed="false">
        Lo consigli?
      </button>
      <button type="button" data-sound="dadove" aria-pressed="false">
        Da dove veniamo?
      </button>
    </main>

    <footer>
      <a href="./disclaimer.html">Disclaimer</a>
      <a
        href="https://comelosmash.it"
        target="_blank"
        rel="noopener noreferrer"
      >
        comelosmash.it
      </a>
    </footer>

    <script>
      const sounds = new Map(
        [...document.querySelectorAll("[data-sound]")].map((button) => {
          const audio = new Audio(`/sounds/${button.dataset.sound}.mp3`);

          audio.addEventListener("ended", () => {
            button.setAttribute("aria-pressed", "false");
          });

          return [button, audio];
        }),
      );

      for (const [button, audio] of sounds) {
        button.addEventListener("click", async () => {
          for (const [otherButton, otherAudio] of sounds) {
            otherAudio.pause();
            otherButton.setAttribute("aria-pressed", "false");
          }

          audio.currentTime = 0;
          button.setAttribute("aria-pressed", "true");

          try {
            await audio.play();
          } catch {
            button.setAttribute("aria-pressed", "false");
          }
        });
      }
    </script>
  </body>
</html>
