  <body>
    <header>
      <h1>Com'è lo smash?</h1>
      <p>È buono? Lo consigli? Da dove vieni?</p>
    </header>
    <main>
      <button type="button" data-sound="comelo">Com'è lo smash?</button>
      <button type="button" data-sound="consigli">Lo consigli?</button>
      <button type="button" data-sound="dadove">Da dove veniamo?</button>
    </main>

    <footer>
      <a href="./disclaimer.html" rel="related">Disclaimer</a>
      <a
        href="https://comelosmash.it"
        target="_blank"
        rel="noopener noreferrer"
      >
        comelosmash.it
      </a>
    </footer>

    <script>
      const sounds = new Map(
        [...document.querySelectorAll("[data-sound]")].map((button) => {
          const audio = new Audio(`/sounds/${button.dataset.sound}.mp3`);

          audio.addEventListener("ended", () => {
            button.classList.remove("is-playing");
          });

          return [button, audio];
        }),
      );

      for (const [button, audio] of sounds) {
        button.addEventListener("click", async () => {
          for (const [otherButton, otherAudio] of sounds) {
            otherAudio.pause();
            otherButton.classList.remove("is-playing");
          }

          audio.currentTime = 0;
          button.classList.add("is-playing");

          try {
            await audio.play();
          } catch {
            button.classList.remove("is-playing");
          }
        });
      }
    </script>
